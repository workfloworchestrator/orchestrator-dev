services:
  postgres:
    container_name: postgres
    image: "pgvector/pgvector:pg17"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nwa
      POSTGRES_PASSWORD: nwa
      POSTGRES_DB: orchestrator-core
    volumes:
      - db-data:/var/lib/postgresql/data/
      - ./docker/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--username",
          "nwa",
          "--dbname",
          "orchestrator-core",
        ]
      interval: "3s"
      timeout: "2s"
      retries: 20
      start_period: "5s"

  redis:
    container_name: redis
    image: docker.io/redis:8-alpine
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - redis-server --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck:
      test: '[ $$(redis-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    env_file:
      - ./docker/redis/redis.env
      - path: ./docker/overrides/redis/redis.env
        required: false

  embeddings:
    container_name: embeddings
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id sentence-transformers/all-MiniLM-L6-v2
    profiles:
      - embeddings
    env_file:
      - ./docker/embeddings/embeddings.env
      - path: ./docker/overrides/embeddings/embeddings.env
        required: false
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ui-library-builder provides separate TS hot-reloading for the UI *library*,
  # which requires a separate process from the example-orchestrator-ui application's
  # Next.js hot-reload. The output /out is on a volume that is mounted to the package's
  # installed /dist in the orchestrator-ui service.
  ui-library-builder:
    image: node:20
    working_dir: /repo
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../orchestrator-ui-library:/repo
      - lib_root_node_modules:/repo/node_modules
      - lib_pkg_node_modules:/repo/packages/orchestrator-ui-components/node_modules
      # Keep .turbo from writing to the host
      - lib_turbo:/repo/.turbo
      - lib_dist:/out
    # This could be improved to rebuild all four packages
    command: >
      sh -c "npm ci &&
             npx turbo run build &&
             cd packages/orchestrator-ui-components &&
             npx tsup --watch --out-dir /out src/index.ts"
    healthcheck:
      test: ["CMD", "test", "-f", "/out/index.js"]
      interval: 5s
      retries: 60


  orchestrator-ui:
    container_name: orchestrator-ui
    build:
      context: ../example-orchestrator-ui
      target: builder
    entrypoint: ["npm", "run", "dev"]
    volumes:
      # Override Next.js configuration to react to changes in orchestrator-ui-components dist/ 
      - ./docker/orchestrator-ui/next.config.js:/app/next.config.js
      # Mount orchestrator-ui-components dist/ from ui-builder
      - type: volume
        source: lib_dist
        target: /app/node_modules/@orchestrator-ui/orchestrator-ui-components/dist
        volume:
          # Prevents previous contents of dist/ from appearing if we mount an empty directory
          nocopy: true
      # It'd be cool to bindmount example-orchestrator-ui here if we get hot-reloading to work.
    working_dir: /app
    env_file:
      - ./docker/orchestrator-ui/orchestrator-ui.env
      - path: ./docker/overrides/orchestrator-ui/orchestrator-ui.env
        required: false
    # Temporary hack because NextAuth doesn't accept distinct well-known URIs for browser/client and its backend
    #ports:
    #  - "3000:3000"
    network_mode: "service:keycloak"
    depends_on:
      ui-library-builder:
        condition: service_healthy
      orchestrator:
        condition: service_started
      keycloak:
        condition: service_started

  orchestrator:
    container_name: orchestrator
    image: ${ORCH_BACKEND_TAG:-ghcr.io/workfloworchestrator/orchestrator-core:latest}
    environment:
      CORE_DST: ${CORE_DST}
      FORMS_DST: ${FORMS_DST}
      OAUTH2LIB_DST: ${OAUTH2LIB_DST}
      NWASTDLIB_DST: ${NWASTDLIB_DST}
    env_file:
      - ./docker/orchestrator/orchestrator.env
      - path: ./docker/overrides/orchestrator/orchestrator.env
        required: false
    # Temporary hack because NextAuth doesn't accept distinct well-known URIs for browser/client and its backend
    #ports:
    #  - "8080:8080"
    #  - "5678:5678" #Enable Python debugger

    # Temporary hack because NextAuth doesn't accept distinct well-known URIs for browser/client and its backend
    network_mode: "service:keycloak"
    volumes:
      - ./alembic.ini:/home/orchestrator/alembic.ini
      - ./db:/home/orchestrator/db
      - ./graphql_utils:/home/orchestrator/graphql_utils
      - ./main.py:/home/orchestrator/main.py
      - ./migrations:/home/orchestrator/migrations
      - ./products:/home/orchestrator/products
      - ./pyproject.toml:/home/orchestrator/pyproject.toml
      - ./services:/home/orchestrator/services
      - ./settings.py:/home/orchestrator/settings.py
      - ./translations:/home/orchestrator/translations
      - ./utils:/home/orchestrator/utils
      - ./workflows:/home/orchestrator/workflows
      - ./wsgi.py:/home/orchestrator/wsgi.py
      - ./docker/orchestrator/.bashrc:/home/orchestrator/.bashrc
      - ./docker/orchestrator/entrypoint.sh:/home/orchestrator/entrypoint.sh
      - ./docker/orchestrator/is_healthy.py:/home/orchestrator/is_healthy.py
      # Manage bind-mounts for hot-reloading Python packages. See README.
      - "${CORE_SRC:-./docker/overrides/orchestrator-core}:${CORE_DST}"
      - "${FORMS_SRC:-./docker/overrides/pydantic-forms}:${FORMS_DST}"
      - "${OAUTH2LIB_SRC:-./docker/overrides/oauth2-lib}:${OAUTH2LIB_DST}"
      - "${NWASTDLIB_SRC:-./docker/overrides/nwa-stdlib}:${NWASTDLIB_DST}"
    entrypoint: ["/home/orchestrator/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
        required: false
      keycloak:
        condition: service_started
    healthcheck:
      start_period: 15s
      timeout: 5s
      interval: 5s
      retries: 20
      test: /home/orchestrator/is_healthy.py

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    # To debug or generate user exports, uncomment the below, comment out "command", and uncomment the keycloak_export volume at bottom of service.
    # entrypoint: tail -f /dev/null
    # Then `export --dir /opt/keycloak/data/export --realm orchestrator --users same_file` inside the container
    command: start-dev --import-realm --http-port=8085
    ports:
      # Keycloak itself
      - "127.0.0.1:8085:8085"
      # Temporary hack because NextAuth doesn't accept distinct well-known URIs for browser/client and its backend.
      # Instead these services have to hand off their networking to the keycloak service in order to live on the same network.
      # This allows to temporarily use a local URI that works in both the host OS browser and intra-app communication within the Docker network.
      - "127.0.0.1:3000:3000" # Orch UI
      # Maybe backend doesn't need this?? Is it just getting data from the JWT?
      # I think it actually does need this to fetch a cert
      # Orch backend is proxied because it needs access to t
      - "127.0.0.1:8080:8080" # Orch backend app
      - "127.0.0.1:5678:5678" # Orch backend debugger
    env_file:
      - ./docker/keycloak/keycloak.env
    volumes:
      # Uncomment if you need to generate new user exports
      #- ./keycloak_export:/opt/keycloak/data/export
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  db-data:
    driver: local
  netbox-redis-cache-data:
    driver: local
  # For binding UI builder into UI container
  lib_root_node_modules:
  lib_pkg_node_modules:
  lib_turbo:
  lib_dist:
  #TODO additional volumes for preventing writes back to the host FS. If possible, should not persist.
