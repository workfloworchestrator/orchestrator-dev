services:
  postgres:
    container_name: postgres
    image: "pgvector/pgvector:pg17"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nwa
      POSTGRES_PASSWORD: nwa
      POSTGRES_DB: orchestrator-core
    volumes:
      - db-data:/var/lib/postgresql/data/
      - ./docker/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--username",
          "nwa",
          "--dbname",
          "orchestrator-core",
        ]
      interval: "3s"
      timeout: "2s"
      retries: 20
      start_period: "5s"

  redis:
    container_name: redis
    image: docker.io/redis:8-alpine
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - redis-server --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck:
      test: '[ $$(redis-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    env_file:
      - ./docker/redis/redis.env
      - path: ./docker/overrides/redis/redis.env
        required: false

  embeddings:
    container_name: embeddings
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id sentence-transformers/all-MiniLM-L6-v2
    profiles:
      - embeddings
    env_file:
      - ./docker/embeddings/embeddings.env
      - path: ./docker/overrides/embeddings/embeddings.env
        required: false
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The UI app. Its source is copied into the image at build time, so changes to
  # example-orchestrator-ui need `docker compose up --build orchestrator-ui`.
  # The component library comes from npm, or from a local orchestrator-ui-library
  # clone when ORCH_UI_LIB_DIR is set. See docker/orchestrator-ui/entrypoint.sh.
  orchestrator-ui:
    container_name: orchestrator-ui
    build:
      context: ${ORCH_UI_DIR:-../example-orchestrator-ui}
      dockerfile_inline: |
        FROM node:24-bookworm-slim
        ENV NEXT_TELEMETRY_DISABLED=1 HUSKY=0 CI=true COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        # procps: tsup --watch needs `ps` to stop the previous --onSuccess command
        RUN apt-get update && apt-get install -y --no-install-recommends procps && rm -rf /var/lib/apt/lists/*
        # Uses the pnpm version pinned in package.json's "packageManager" field
        RUN corepack enable
        WORKDIR /app
        COPY . .
        # Drop anything installed or built on the host (incl. a host-side local library checkout)
        RUN rm -rf node_modules .next orchestrator-ui-components && pnpm install --frozen-lockfile
    entrypoint: ["/entrypoint.sh"]
    environment:
      # File events from host bind mounts don't always reach the container; poll instead.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./docker/orchestrator-ui/entrypoint.sh:/entrypoint.sh:ro
      # Local library clone, or an empty directory to use the npm release. See README.
      - "${ORCH_UI_LIB_DIR:-./docker/overrides/orchestrator-ui-library}:/app/orchestrator-ui-components"
      # Keep the library's node_modules out of the host clone
      - ui_lib_node_modules:/app/orchestrator-ui-components/node_modules
    working_dir: /app
    env_file:
      - ./docker/orchestrator-ui/orchestrator-ui.env
      - path: ./docker/overrides/orchestrator-ui/orchestrator-ui.env
        required: false
    # Temporary hack because NextAuth doesn't accept distinct well-known URIs for browser/client and its backend
    #ports:
    #  - "3000:3000"
    network_mode: "service:keycloak"
    depends_on:
      orchestrator:
        condition: service_started
      keycloak:
        condition: service_started

  orchestrator:
    container_name: orchestrator
    image: ${ORCH_BACKEND_TAG:-ghcr.io/workfloworchestrator/orchestrator-core:latest}
    environment:
      # Fallbacks must match the volume targets below, so the entrypoint finds the mounts.
      CORE_DST: ${CORE_DST:-/home/orchestrator/orchestrator-core}
      FORMS_DST: ${FORMS_DST:-/home/orchestrator/pydantic-forms}
      OAUTH2LIB_DST: ${OAUTH2LIB_DST:-/home/orchestrator/oauth2-lib}
      NWASTDLIB_DST: ${NWASTDLIB_DST:-/home/orchestrator/nwa-stdlib}
    env_file:
      - ./docker/orchestrator/orchestrator.env
      - path: ./docker/overrides/orchestrator/orchestrator.env
        required: false
    # Temporary hack because NextAuth doesn't accept distinct well-known URIs for browser/client and its backend
    #ports:
    #  - "8080:8080"
    #  - "5678:5678" #Enable Python debugger

    # Temporary hack because NextAuth doesn't accept distinct well-known URIs for browser/client and its backend
    network_mode: "service:keycloak"
    volumes:
      - ./alembic.ini:/home/orchestrator/alembic.ini
      - ./db:/home/orchestrator/db
      - ./graphql_utils:/home/orchestrator/graphql_utils
      - ./main.py:/home/orchestrator/main.py
      - ./migrations:/home/orchestrator/migrations
      - ./products:/home/orchestrator/products
      - ./pyproject.toml:/home/orchestrator/pyproject.toml
      - ./uv.lock:/home/orchestrator/uv.lock
      - ./services:/home/orchestrator/services
      - ./settings.py:/home/orchestrator/settings.py
      - ./translations:/home/orchestrator/translations
      - ./utils:/home/orchestrator/utils
      - ./workflows:/home/orchestrator/workflows
      - ./wsgi.py:/home/orchestrator/wsgi.py
      - ./docker/orchestrator/.bashrc:/home/orchestrator/.bashrc
      - ./docker/orchestrator/entrypoint.sh:/home/orchestrator/entrypoint.sh
      - ./docker/orchestrator/is_healthy.py:/home/orchestrator/is_healthy.py
      # Manage bind-mounts for hot-reloading Python packages. See README.
      - "${CORE_SRC:-./docker/overrides/orchestrator-core}:${CORE_DST:-/home/orchestrator/orchestrator-core}"
      - "${FORMS_SRC:-./docker/overrides/pydantic-forms}:${FORMS_DST:-/home/orchestrator/pydantic-forms}"
      - "${OAUTH2LIB_SRC:-./docker/overrides/oauth2-lib}:${OAUTH2LIB_DST:-/home/orchestrator/oauth2-lib}"
      - "${NWASTDLIB_SRC:-./docker/overrides/nwa-stdlib}:${NWASTDLIB_DST:-/home/orchestrator/nwa-stdlib}"
    entrypoint: ["/home/orchestrator/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
        required: false
      keycloak:
        condition: service_started
    healthcheck:
      start_period: 15s
      timeout: 5s
      interval: 5s
      retries: 20
      test: /home/orchestrator/is_healthy.py

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    # To debug or generate user exports, uncomment the below, comment out "command", and uncomment the keycloak_export volume at bottom of service.
    # entrypoint: tail -f /dev/null
    # Then `export --dir /opt/keycloak/data/export --realm orchestrator --users same_file` inside the container
    command: start-dev --import-realm --http-port=8085
    ports:
      # Keycloak itself
      - "127.0.0.1:8085:8085"
      # Temporary hack because NextAuth doesn't accept distinct well-known URIs for browser/client and its backend.
      # Instead these services have to hand off their networking to the keycloak service in order to live on the same network.
      # This allows to temporarily use a local URI that works in both the host OS browser and intra-app communication within the Docker network.
      - "127.0.0.1:3000:3000" # Orch UI
      # Maybe backend doesn't need this?? Is it just getting data from the JWT?
      # I think it actually does need this to fetch a cert
      # Orch backend is proxied because it needs access to t
      - "127.0.0.1:8080:8080" # Orch backend app
      - "127.0.0.1:5678:5678" # Orch backend debugger
    env_file:
      - ./docker/keycloak/keycloak.env
    volumes:
      # Uncomment if you need to generate new user exports
      #- ./keycloak_export:/opt/keycloak/data/export
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  db-data:
    driver: local
  netbox-redis-cache-data:
    driver: local
  # node_modules of the local orchestrator-ui-library clone
  ui_lib_node_modules:
